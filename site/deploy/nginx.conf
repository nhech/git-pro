# Static origin for git-pro.longtd.me. TLS, HTTP/2 and the public hostname are handled by Cloudflare; the
# tunnel reaches this server on 127.0.0.1 only (see compose.yml).
server_tokens off;
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_types text/css application/javascript image/svg+xml application/manifest+json application/xml text/plain;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  charset_types text/css application/javascript application/manifest+json application/xml text/plain image/svg+xml;
  # Behind the tunnel the container port is not the public one, so redirects must stay relative.
  absolute_redirect off;
  error_page 404 /404.html;
  # Cloudflare sends the visitor's scheme in X-Forwarded-Proto: plain-HTTP visitors move to HTTPS. Local checks send
  # no such header and are served directly; the tunnel hop itself is already encrypted.
  if ($http_x_forwarded_proto = "http") {
    return 301 https://$host$request_uri;
  }

  # add_header in a location replaces the server-level headers, so every location includes the same set.
  location = /404.html {
    internal;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }
  location ~ /\. {
    return 404;
  }
  location ~* \.(?:css|js)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=3600, must-revalidate" always;
  }
  location ~* \.(?:jpg|png|svg)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
  }
  # nginx's mime.types has no .webmanifest entry.
  location ~* \.webmanifest$ {
    types { }
    default_type application/manifest+json;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
  }
  location / {
    try_files $uri $uri/ =404;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }
}
