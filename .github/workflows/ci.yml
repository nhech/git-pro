name: CI
on: [push, pull_request]
jobs:
  core:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - id: check
        run: npm run check 2>&1 | tee "$RUNNER_TEMP/check.log"; exit "${PIPESTATUS[0]}"
        shell: bash
      - name: Annotate failing checks
        if: failure() && steps.check.outcome == 'failure'
        shell: bash
        # Job logs need a signed-in viewer; an annotation keeps the failing tests readable from the run page.
        run: |
          details=$(grep -A24 '^not ok' "$RUNNER_TEMP/check.log" | head -120)
          [ -n "$details" ] || details=$(tail -40 "$RUNNER_TEMP/check.log")
          echo "::error title=npm run check (${{ matrix.os }})::$(printf '%s' "$details" | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')"
      - run: npm run package
      - run: npm run audit:licenses
  extension:
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        vscode: ['1.100.0', stable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run package
      - run: xvfb-run -a npm run test:extension
        if: runner.os == 'Linux'
        env:
          GIT_PRO_STRESS_HOST: '1'
          GIT_PRO_TEST_VERSION: ${{ matrix.vscode }}
          GIT_PRO_TEST_VSIX: ${{ github.workspace }}/artifacts/git-pro-0.1.0.vsix
      - run: npm run test:extension
        if: runner.os != 'Linux'
        env:
          GIT_PRO_STRESS_HOST: '1'
          GIT_PRO_TEST_VERSION: ${{ matrix.vscode }}
          GIT_PRO_TEST_VSIX: ${{ github.workspace }}/artifacts/git-pro-0.1.0.vsix
      - run: xvfb-run -a npm run test:extension
        if: runner.os == 'Linux'
        env:
          GIT_PRO_TEST_RESTART: '1'
          GIT_PRO_TEST_VERSION: ${{ matrix.vscode }}
          GIT_PRO_TEST_VSIX: ${{ github.workspace }}/artifacts/git-pro-0.1.0.vsix
      - run: npm run test:extension
        if: runner.os != 'Linux'
        env:
          GIT_PRO_TEST_RESTART: '1'
          GIT_PRO_TEST_VERSION: ${{ matrix.vscode }}
          GIT_PRO_TEST_VSIX: ${{ github.workspace }}/artifacts/git-pro-0.1.0.vsix
